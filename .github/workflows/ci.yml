name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check --manifest-path commercial/control-plane/Cargo.toml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/theme.js
      - run: node --check web/landing.js
      - run: node --check web/dashboard.js
      # Replaces scripts/check-i18n.py, which scanned only the HTML and so left
      # every t() call in dashboard.js unchecked. Also covers interpolation
      # parity across locales and brand.json against its own schema.
      - run: node --test "web/tests/*.test.mjs"
      - run: python3 -m py_compile plugins/examples/ai-http-adapter/plugin.py plugins/examples/storage-s3/plugin.py
      # object_key is the only place a client-supplied string becomes a path
      # inside the bucket, so it is tested. boto3 is stubbed rather than
      # installed — see the test's docstring.
      - run: python3 -m unittest discover -s plugins/examples/tests -t plugins/examples/tests -p "test_*.py"
