name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check --manifest-path commercial/control-plane/Cargo.toml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/theme.js
      - run: node --check web/landing.js
      - run: node --check web/dashboard.js
      - run: python3 -m json.tool web/brand.json >/dev/null
      - run: for f in web/locales/*.json; do python3 -m json.tool "$f" >/dev/null; done
      - run: python3 scripts/check-i18n.py
      - run: python3 -m py_compile plugins/examples/ai-http-adapter/plugin.py plugins/examples/storage-s3/plugin.py
