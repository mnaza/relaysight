name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: for f in web/*.js; do node --check "$f"; done
      # Replaces scripts/check-i18n.py, which scanned only the HTML and so left
      # every t() call in dashboard.js unchecked. Also covers interpolation
      # parity across locales and brand.json against its own schema.
      # jsdom is the repository's only JavaScript dependency and it is
      # test-only — the shipped page loads no bundler and no framework.
      - run: npm ci --prefix web
      - run: npm test --prefix web
