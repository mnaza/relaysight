# coturn for RelaySight.
#
# Everything here is static. The three values that change per deployment --
# the realm, the public address, and the shared secret -- are passed on the
# command line from docker-compose, because coturn does not read them from the
# environment. See docs/TURN-DEPLOY.md.

# Long-term credentials derived from a shared secret, not stored. The API mints
# username=<expiry>[:<label>] and password=base64(HMAC-SHA1(secret, username)),
# and coturn recomputes it. Nothing is provisioned and nothing is revoked; a
# leaked pair expires on its own. See services/api/src/turn.rs.
use-auth-secret

listening-port=3478

# TURN over TLS on 443. The networks that most need a relay allow nothing
# outbound but TLS on 443, and the same firewalls block 5349. This is
# tls-listening-port, not alt-tls-listening-port: the alternative port is for
# NAT behaviour discovery and never opens 443.
#
# Without a readable certificate and key coturn does not fail. It starts with
# no TLS listener and says so once in the log, which is what the compose
# healthcheck is there to catch.
tls-listening-port=443
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

fingerprint

# The relay port range. Every relayed session takes one port from it, so this
# caps concurrent relayed streams at 40 by itself. Raise it and the firewall
# rule together, or sessions fail once it fills with no useful error.
min-port=49160
max-port=49200

# An open TURN server is a proxy into whatever it can reach, and it is reached
# by anyone holding a credential. These lines are the difference between a
# relay and a way into the host's own network.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# A credential is handed to a browser, so treat every one as public. These are
# the limits that decide what a stolen one can cost before it expires.
user-quota=12
total-quota=1200
stale-nonce=600

# No management interface. It listens on 5766 by default and has no business
# existing on a box that only relays.
no-cli
no-tlsv1
no-tlsv1_1

# Relay only. This server has no other job.
no-software-attribute
simple-log
