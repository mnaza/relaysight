<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="White-label cloud operations for CCTV installers" />
  <link rel="stylesheet" href="styles.css" />
  <title>Loading…</title>
</head>
<body class="site-body">
  <header class="container">
    <nav class="nav">
      <div id="brand-slot"></div>
      <div class="nav-links">
        <a href="#product" data-i18n="nav.product"></a>
        <a href="#how" data-i18n="nav.how"></a>
        <a href="#plugins" data-i18n="nav.plugins"></a>
        <a href="#pricing" data-i18n="nav.pricing"></a>
        <a href="#security" data-i18n="nav.security"></a>
      </div>
      <div class="nav-actions">
        <span id="locale-slot"></span>
        <a class="button" href="app.html" data-i18n="nav.demo"></a>
      </div>
    </nav>
  </header>

  <main>
    <section class="container hero">
      <div>
        <span class="badge"><i class="badge-dot"></i><span data-i18n="hero.badge"></span></span>
        <h1 data-i18n="hero.title"></h1>
        <p class="hero-copy" data-i18n="hero.subtitle"></p>
        <div class="hero-actions">
          <a class="button primary" href="app.html#onboarding" data-i18n="hero.primary"></a>
          <a class="button" href="#pricing" data-i18n="hero.secondary"></a>
        </div>
        <div class="hero-note" data-i18n="hero.noCard"></div>
      </div>
      <div class="hero-product" aria-label="Product preview">
        <div class="browser-bar"><i class="browser-dot"></i><i class="browser-dot"></i><i class="browser-dot"></i></div>
        <div class="mini-app">
          <aside class="mini-sidebar">
            <div class="brand-mark" id="preview-mark">R</div>
            <div class="mini-nav" style="margin-top:38px"></div><div class="mini-nav"></div><div class="mini-nav"></div><div class="mini-nav"></div>
          </aside>
          <div class="mini-main">
            <div class="mini-title"></div>
            <div class="mini-stats">
              <div class="mini-card"><span data-i18n="preview.online"></span><b>1,218</b></div>
              <div class="mini-card"><span data-i18n="preview.alerts"></span><b>7</b></div>
              <div class="mini-card"><span data-i18n="preview.sites"></span><b>37</b></div>
            </div>
            <div class="mini-row"><span class="mini-row-name">Madrid Centro</span><span class="status">28 / 28</span><span>99.9%</span></div>
            <div class="mini-row"><span class="mini-row-name">Valencia Russafa</span><span class="status offline">16 / 17</span><span>94.1%</span></div>
            <div class="mini-row"><span class="mini-row-name">Barcelona Poblenou</span><span class="status warning">42 / 44</span><span>97.8%</span></div>
            <div class="mini-row"><span class="mini-row-name">Alicante Marina</span><span class="status">31 / 31</span><span>99.8%</span></div>
            <div class="mini-alert" data-i18n="preview.alert"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="container proof">
      <div class="proof-card"><strong>1,247</strong><span data-i18n="proof.cameras"></span></div>
      <div class="proof-card"><strong>37</strong><span data-i18n="proof.sites"></span></div>
      <div class="proof-card"><strong>7</strong><span data-i18n="proof.alerts"></span></div>
    </section>

    <section id="product" class="container section">
      <div class="section-eyebrow" data-i18n="section.problem.eyebrow"></div>
      <h2 data-i18n="section.problem.title"></h2>
      <div class="grid-4">
        <article class="feature-card"><div class="feature-number">01</div><h3 data-i18n="feature.health.title"></h3><p data-i18n="feature.health.body"></p></article>
        <article class="feature-card"><div class="feature-number">02</div><h3 data-i18n="feature.remote.title"></h3><p data-i18n="feature.remote.body"></p></article>
        <article class="feature-card"><div class="feature-number">03</div><h3 data-i18n="feature.multi.title"></h3><p data-i18n="feature.multi.body"></p></article>
        <article class="feature-card"><div class="feature-number">04</div><h3 data-i18n="feature.brand.title"></h3><p data-i18n="feature.brand.body"></p></article>
      </div>
    </section>

    <section id="how" class="container section">
      <div class="section-eyebrow" data-i18n="how.eyebrow"></div>
      <h2 data-i18n="how.title"></h2>
      <div class="steps">
        <article class="step"><h3 data-i18n="how.one.title"></h3><p data-i18n="how.one.body"></p></article>
        <article class="step"><h3 data-i18n="how.two.title"></h3><p data-i18n="how.two.body"></p></article>
        <article class="step"><h3 data-i18n="how.three.title"></h3><p data-i18n="how.three.body"></p></article>
      </div>
    </section>


    <section id="plugins" class="container section">
      <div class="section-eyebrow" data-i18n="plugins.eyebrow"></div>
      <h2 data-i18n="plugins.title"></h2>
      <p class="section-copy" data-i18n="plugins.body"></p>
      <div class="grid-4 plugin-marketing-grid">
        <article class="feature-card"><div class="feature-number">AI</div><h3 data-i18n="plugins.ai.title"></h3><p data-i18n="plugins.ai.body"></p></article>
        <article class="feature-card"><div class="feature-number">S3</div><h3 data-i18n="plugins.storage.title"></h3><p data-i18n="plugins.storage.body"></p></article>
        <article class="feature-card"><div class="feature-number">HTTP</div><h3 data-i18n="plugins.open.title"></h3><p data-i18n="plugins.open.body"></p></article>
        <article class="feature-card"><div class="feature-number">1</div><h3 data-i18n="plugins.same.title"></h3><p data-i18n="plugins.same.body"></p></article>
      </div>
    </section>

    <section id="pricing" class="container section">
      <div class="section-eyebrow" data-i18n="pricing.eyebrow"></div>
      <h2 data-i18n="pricing.title"></h2>
      <div class="pricing-grid">
        <article class="price-card open-source-card"><span class="plan-kicker" data-i18n="pricing.community.kicker"></span><h3 data-i18n="pricing.community.title"></h3><div class="price" data-i18n="pricing.community.price"></div><p data-i18n="pricing.community.body"></p><ul data-list="pricing.community.items"></ul></article>
        <article class="price-card featured"><span class="plan-kicker" data-i18n="pricing.cloud.kicker"></span><h3 data-i18n="pricing.cloud.title"></h3><div class="price" data-i18n="pricing.cloud.price"></div><p data-i18n="pricing.cloud.body"></p><ul data-list="pricing.cloud.items"></ul></article>
        <article class="price-card"><span class="plan-kicker" data-i18n="pricing.enterprise.kicker"></span><h3 data-i18n="pricing.enterprise.title"></h3><div class="price" data-i18n="pricing.enterprise.price"></div><p data-i18n="pricing.enterprise.body"></p><ul data-list="pricing.enterprise.items"></ul></article>
      </div>
    </section>

    <section id="security" class="container section">
      <div class="security-box">
        <div><div class="section-eyebrow" data-i18n="security.eyebrow"></div><h2 data-i18n="security.title"></h2><p data-i18n="security.body"></p></div>
        <div class="security-list"><div class="security-pill" data-i18n="security.pill.outbound"></div><div class="security-pill" data-i18n="security.pill.mtls"></div><div class="security-pill" data-i18n="security.pill.tenant"></div><div class="security-pill" data-i18n="security.pill.audit"></div></div>
      </div>
    </section>

    <section class="container cta">
      <h2 data-i18n="cta.title"></h2><p data-i18n="cta.body"></p><a href="app.html#onboarding" class="button primary" data-i18n="cta.primary"></a>
    </section>
  </main>

  <footer class="container footer"><span id="footer-brand"></span><span data-i18n="footer.note"></span></footer>
  <script type="module" src="landing.js"></script>
</body>
</html>
