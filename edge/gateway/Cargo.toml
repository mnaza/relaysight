[package]
name = "vms-gateway"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
webrtc = "0.20.3"
rtc = "0.20.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
digest_auth = "0.3.1"
bytes = "1.12"
chacha20poly1305 = "0.10"
async-trait = "0.1"
anyhow.workspace = true
base64 = "0.22"
chrono.workspace = true
futures = "0.3"
quick-xml = "0.38"
rand = "0.8"
reqwest.workspace = true
# Release signatures (Ed25519) and hashes. Already in the tree through rustls.
ring = "0.17"
# scottlamb/retina#137, not yet released: some Dahua firmware writes the same
# SSRC as hex in Transport and decimal in RTP-Info, and stock retina refuses
# the stream. Back to crates.io once a release carries the fix.
retina = { git = "https://github.com/mnaza/retina", rev = "83b25a88a62f83cd6605ab36486434ff9e34733a" }
sha1 = "0.10"
serde.workspace = true
serde_json.workspace = true
shiguredo_mp4 = "2026.4.0"
url = "2"
uuid = { workspace = true, features = ["v5"] }
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
vms-domain = { path = "../../crates/domain" }
vms-plugin-sdk = { path = "../../crates/plugin-sdk" }

[dev-dependencies]
tempfile = "3"
